
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum JavaScript</title>
</head>
<body>
    <h1>Pengenalan JavaScript</h1>
    <p id="pesan">Konten awal.</p>

    <hr>

    <h2>Latihan 6 - Bilangan Genap atau Ganjil</h2>

    <label for="bilangan">Masukkan bilangan bulat:</label>
    <input type="number" id="bilangan" step="1">
    <button type="button" onclick="cekBilangan()">Periksa</button>
    <p id="hasilBilangan"></p>

    <hr>

    <h2>Latihan 7 - Mengubah Warna Latar</h2>

    <button type="button" onclick="ubahWarnaLatar('lightgreen')">
        Latar Hijau
    </button>

    <button type="button" onclick="ubahWarnaLatar('white')">
        Latar Putih
    </button>

    <button type="button" onclick="ubahWarnaLatar('lightyellow')">
        Latar Kuning
    </button>

    <hr>

    <h2>Latihan 8 - Daftar Menu Makanan</h2>

    <label>
        <input type="checkbox" class="menu" value="5000">
        Ayam Goreng — Rp5.000
    </label>
    <br>

    <label>
        <input type="checkbox" class="menu" value="500">
        Tempe — Rp500
    </label>
    <br>

    <label>
        <input type="checkbox" class="menu" value="2500">
        Telur Dadar — Rp2.500
    </label>
    <br>

    <label>
        <input type="checkbox" class="menu" value="3000">
        Es Teh — Rp3.000
    </label>
    <br>

    <label>
        <input type="checkbox" class="menu" value="4000">
        Nasi Putih — Rp4.000
    </label>

    <p>Total: Rp<span id="total">0</span></p>

    <hr>

    <h2>Mini Project - Kalkulator Nilai Mahasiswa</h2>

    <form onsubmit="event.preventDefault(); hitungDariForm();">
        <label for="nilaiTugas">Nilai Tugas (0–100):</label>
        <input type="number" id="nilaiTugas" min="0" max="100" step="any" required>
        <br><br>

        <label for="nilaiUTS">Nilai UTS (0–100):</label>
        <input type="number" id="nilaiUTS" min="0" max="100" step="any" required>
        <br><br>

        <label for="nilaiUAS">Nilai UAS (0–100):</label>
        <input type="number" id="nilaiUAS" min="0" max="100" step="any" required>
        <br><br>

        <button type="submit">Hitung Nilai</button>
    </form>

    <p id="hasilNilai"></p>

    <hr>

    <h2>Eksperimen Mandiri - Tampilkan/Sembunyikan</h2>

    <p id="teksToggle">Ini adalah teks yang bisa disembunyikan.</p>

    <button type="button" onclick="toggleTeks()">
        Tampilkan / Sembunyikan Teks
    </button>

    <script src="script.js"></script>

</body>
</html>
